<svg xmlns="http://www.w3.org/2000/svg" width="442" height="1024" viewBox="0 0 442 1024" role="img" aria-labelledby="title description">
  <title id="title">terminuke host archive preview</title>
  <desc id="description">A warm-paper and graphite Android host archive screen with editorial typography.</desc>
  <rect width="442" height="1024" fill="#E9E3D8"/>

  <!-- Status area -->
  <text x="25" y="28" fill="#111111" font-family="Arial, sans-serif" font-size="16" font-weight="600">5:30</text>
  <text x="272" y="22" fill="#111111" font-family="Arial, sans-serif" font-size="7" font-weight="700">0.15</text>
  <text x="272" y="30" fill="#111111" font-family="Arial, sans-serif" font-size="7" font-weight="700">KB/S</text>
  <rect x="300" y="14" width="27" height="17" rx="4" fill="#111111"/>
  <text x="303" y="26" fill="#F7F5F0" font-family="Arial, sans-serif" font-size="8" font-weight="700">VoLTE</text>
  <rect x="337" y="18" width="4" height="13" rx="1" fill="#68645D"/>
  <rect x="344" y="15" width="4" height="16" rx="1" fill="#68645D"/>
  <rect x="351" y="12" width="4" height="19" rx="1" fill="#68645D"/>
  <path d="M364 18 Q376 7 388 18 M368 22 Q376 15 384 22 M373 26 Q376 23 379 26" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round"/>
  <rect x="394" y="12" width="30" height="18" rx="6" fill="#111111"/>
  <rect x="424" y="17" width="3" height="8" rx="1" fill="#111111"/>
  <text x="400" y="25" fill="#E9E3D8" font-family="Arial, sans-serif" font-size="11" font-weight="700">70</text>

  <!-- Masthead -->
  <text x="27" y="95" fill="#262522" font-family="Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="-1.6">terminuke</text>
  <text x="27" y="119" fill="#827B70" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.4">PERSONAL REMOTE ARCHIVE</text>
  <text x="320" y="97" fill="#8C604A" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.2">SSH / ANDROID</text>

  <!-- Page index -->
  <text x="58" y="174" fill="#262522" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.2">HOSTS</text>
  <text x="204" y="174" fill="#827B70" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.2">KEYS</text>
  <text x="324" y="174" fill="#827B70" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.2">SETTINGS</text>
  <line x1="27" y1="194" x2="140" y2="194" stroke="#8C604A" stroke-width="2"/>
  <line x1="165" y1="194" x2="278" y2="194" stroke="#BDB5A9" stroke-width="1"/>
  <line x1="302" y1="194" x2="416" y2="194" stroke="#BDB5A9" stroke-width="1"/>
  <line x1="0" y1="209" x2="442" y2="209" stroke="#BDB5A9" stroke-width="1"/>

  <!-- Archive heading -->
  <text x="27" y="255" fill="#8C604A" font-family="Arial, sans-serif" font-size="11" letter-spacing="2.1">REMOTE ENDPOINTS</text>
  <text x="27" y="308" fill="#262522" font-family="Arial, sans-serif" font-size="43" font-weight="300" letter-spacing="-1.8">Host archive</text>
  <text x="347" y="307" fill="#827B70" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">00 / SAVED</text>

  <!-- Search and action -->
  <rect x="27" y="350" width="261" height="68" rx="5" fill="none" stroke="#BDB5A9" stroke-width="1.2"/>
  <text x="47" y="391" fill="#827B70" font-family="Arial, sans-serif" font-size="19" letter-spacing="1.1">SEARCH THE INDEX</text>
  <rect x="303" y="354" width="113" height="50" fill="#292826"/>
  <text x="332" y="385" fill="#F7F5F0" font-family="Arial, sans-serif" font-size="14" letter-spacing="1">+ HOST</text>

  <!-- Empty archive plate -->
  <rect x="27" y="450" width="389" height="362" fill="#292826"/>
  <text x="56" y="499" fill="#D8D1C6" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">NO ENDPOINTS</text>
  <text x="56" y="554" fill="#F7F5F0" font-family="Arial, sans-serif" font-size="32" font-weight="300">Your remote</text>
  <text x="56" y="592" fill="#F7F5F0" font-family="Arial, sans-serif" font-size="32" font-weight="300">workspace begins</text>
  <text x="56" y="630" fill="#F7F5F0" font-family="Arial, sans-serif" font-size="32" font-weight="300">here.</text>
  <text x="56" y="674" fill="#D8D1C6" font-family="Arial, sans-serif" font-size="17">Add a host to create your first</text>
  <text x="56" y="701" fill="#D8D1C6" font-family="Arial, sans-serif" font-size="17">connection plate.</text>
  <rect x="56" y="728" width="201" height="49" fill="none" stroke="#D8D1C6" stroke-width="1.2"/>
  <text x="86" y="758" fill="#F7F5F0" font-family="Arial, sans-serif" font-size="12" letter-spacing="1">ADD FIRST HOST</text>
  <path d="M225 751l8 0m-3-4 4 4-4 4" fill="none" stroke="#F7F5F0" stroke-width="1.4"/>

  <!-- Gesture bar -->
  <rect x="141" y="1004" width="160" height="4" rx="2" fill="#AAA398"/>
</svg>
